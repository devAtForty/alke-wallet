<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Alke Wallet | Enviar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="container py-5">
        <div class="glass-card p-4">
            <h2 class="mb-4">Enviar Dinero</h2>
            <div class="input-group mb-4">
                <input type="text" class="form-control bg-transparent text-white" placeholder="Buscar contacto...">
                <button class="btn btn-outline-info" type="button">Buscar</button>
            </div>
            
            <div class="d-flex gap-2 mb-4">
                <button type="button" class="btn btn-primary-custom flex-grow-1" data-bs-toggle="modal" data-bs-target="#contactModal">
                    Agregar nuevo contacto
                </button>
                <a href="menu.html" class="btn btn-outline-secondary">Volver</a>
            </div>
        </div>
    </div>

    <div class="modal fade" id="contactModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-white border-secondary">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title">Nuevo Contacto</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="text" class="form-control mb-2" placeholder="Nombre completo">
                    <input type="text" class="form-control" placeholder="RUT o Cuenta">
                </div>
                <div class="modal-footer border-secondary">
                    <button type="button" class="btn btn-primary-custom">Guardar</button>
                </div>
            </div>
        </div>
    </div>
    <script src="assets/js/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
