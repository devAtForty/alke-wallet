<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alke Wallet | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="d-flex align-items-center">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-11 col-sm-8 col-md-5 glass-card p-5 text-center">
                <h2 class="mb-4 fw-bold">Inicio de sesión</h2>
                <form action="menu.html">
                    <div class="mb-3 text-start">
                        <label class="form-label small text-info">Email</label>
                        <input type="email" class="form-control bg-transparent text-white border-secondary" required>
                    </div>
                    <div class="mb-4 text-start">
                        <label class="form-label small text-info">Contraseña</label>
                        <input type="password" class="form-control bg-transparent text-white border-secondary" required>
                    </div>
                    <button type="submit" class="btn btn-primary-custom w-100 py-3">Iniciar sesión</button>
                </form>
            </div>
        </div>
    </div>
    <script src="assets/js/script.js"></script>
</body>
</html>
